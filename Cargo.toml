[package]
name = "ares_client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
jvmti-bindings = "3.0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
jvmti-bindings = { version = "3.0.2", features = ["embed"] }
